name: Windows preview
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Audit and publish Windows x64
        shell: pwsh
        run: |
          dotnet restore windows/Nashi.Windows --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Nashi.Windows -c Release --no-restore -o build/windows/Nashi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified media tools and exercise real exports
        shell: pwsh
        env:
          NASHI_VERIFY_DOWNLOAD_TOOLS: '1'
          NASHI_VERIFY_TOOLS_DIRECTORY: '${{ runner.temp }}\Nashi-Test-Tools'
        run: |
          dotnet run --project windows/Nashi.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native image PDF ZIP and WPF render checks
        shell: pwsh
        env:
          NASHI_SMOKE_DIRECTORY: '${{ github.workspace }}\build\windows-smoke'
        run: |
          $process = Start-Process build/windows/Nashi/Nashi.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path build/windows-smoke/smoke.json)) { throw 'No native smoke result' }
          Get-Content build/windows-smoke/smoke.json
      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/Nashi/* -DestinationPath build/Nashi-Windows-x64.zip
          Get-FileHash build/Nashi-Windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-preview
          path: |
            build/Nashi-Windows-x64.zip
            build/windows-smoke
          retention-days: 7
          if-no-files-found: error
