name: Public Windows update verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Verify anonymous download and real portable update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'build/public-update-proof'
          New-Item -ItemType Directory -Force $proof | Out-Null
          $base = 'https://github.com/orkunisitmak/nashi-app/releases/download/v0.7.0-30/'
          $zip = Join-Path $proof 'initial.zip'
          $manifest = Join-Path $proof 'initial.json'
          Invoke-WebRequest ($base + 'Nashi-Windows-x64.zip') -OutFile $zip
          Invoke-WebRequest ($base + 'windows-update.json') -OutFile $manifest
          $env:NASHI_VERIFY_UPDATE_MANIFEST = $manifest
          $env:NASHI_VERIFY_UPDATE_ARCHIVE = $zip
          dotnet run --project windows/Nashi.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'Nashi-Portable-Update'
          Expand-Archive $zip $target
          $old = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $target 'Nashi.dll')).FileVersion
          $process = Start-Process (Join-Path $target 'Nashi.exe') -ArgumentList '--install-update' -WorkingDirectory $target -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path $env:LOCALAPPDATA 'Nashi/update-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw 'Initial updater failed'
          }
          $new = $old
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path (Join-Path $target 'Nashi.dll')) { $new = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $target 'Nashi.dll')).FileVersion }
            if ([version]$new -gt [version]$old) { break }
          }
          if ([version]$new -le [version]$old) { throw 'Installed version did not advance' }
          Get-Process -Name Nashi -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $target 'Nashi.exe') } | ForEach-Object { $_.CloseMainWindow() | Out-Null; $_.WaitForExit(15000) | Out-Null }
          $env:NASHI_SMOKE_DIRECTORY = Join-Path $proof 'updated-native-smoke'
          $check = Start-Process (Join-Path $target 'Nashi.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Updated native app smoke failed' }
          @{ oldVersion = $old; newVersion = $new; anonymous = $true; signedArchiveVerified = $true; realInstallerAndRestart = $true } | ConvertTo-Json | Set-Content (Join-Path $proof 'result.json')
          Remove-Item $zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-windows-update-proof
          path: build/public-update-proof
          retention-days: 7
